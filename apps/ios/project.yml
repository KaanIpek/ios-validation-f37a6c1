name: GroceryOS
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "$(GROCERY_BUILD_NUMBER)"
    MARKETING_VERSION: "$(GROCERY_MARKETING_VERSION)"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  GroceryOS:
    type: application
    platform: iOS
    sources:
      - path: GroceryOS
      - path: Shared
    resources:
      - path: GroceryOS/Assets.xcassets
      - path: GroceryOS/PrivacyInfo.xcprivacy
    settings:
      base:
        INFOPLIST_FILE: GroceryOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: GroceryOS/GroceryOS.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: "$(IOS_BUNDLE_ID)"
        PRODUCT_NAME: GroceryOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GROCERY_WEB_BASE_URL: "$(GROCERY_WEB_BASE_URL)"
        GROCERY_APP_GROUP_ID: "$(IOS_APP_GROUP_ID)"
    dependencies:
      - target: GroceryOSShare
        embed: true
  GroceryOSShare:
    type: app-extension
    platform: iOS
    sources:
      - path: GroceryOSShare
      - path: Shared
    resources:
      - path: GroceryOSShare/PrivacyInfo.xcprivacy
    settings:
      base:
        INFOPLIST_FILE: GroceryOSShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: GroceryOSShare/GroceryOSShare.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: "$(IOS_SHARE_BUNDLE_ID)"
        PRODUCT_NAME: GroceryOSShare
        SKIP_INSTALL: YES
        GROCERY_APP_GROUP_ID: "$(IOS_APP_GROUP_ID)"
  GroceryOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GroceryOSTests
    dependencies:
      - target: GroceryOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(IOS_BUNDLE_ID).tests"
schemes:
  GroceryOS:
    build:
      targets:
        GroceryOS: all
        GroceryOSShare: all
        GroceryOSTests: [test]
    test:
      targets:
        - GroceryOSTests

[build]
command = "pnpm --filter @grocery-os/web build"
publish = "apps/web/.next"

[build.environment]
NODE_VERSION = "22.23.2"
PNPM_FLAGS = "--shamefully-hoist"
APP_ENV = "staging"
FEATURE_ORDER_SUBMIT = "false"
FEATURE_AUTOBUY = "false"
FEATURE_PUBLIC_SCRAPING = "false"
FEATURE_BROWSER_AUTOMATION = "false"
FEATURE_COMMERCE_DEVELOPMENT_PROBE = "false"
FEATURE_WIKIBOOKS_RECIPES = "false"
FEATURE_SOCIAL_RECIPE_IMPORT = "false"
FEATURE_TIKTOK_CAPTION_TRANSFORM = "false"
FEATURE_HEALTH_PROFILE = "false"
FEATURE_UGC_PUBLIC_SHARING = "false"
FEATURE_LOCAL_PERSISTED_FIXTURE = "false"
FEATURE_USDA_FDC = "false"
FEATURE_OPENFDA_FOOD_ENFORCEMENT = "false"
FEATURE_PUBLIC_STORE_DISCOVERY = "false"
FEATURE_KROGER_PUBLIC_API = "false"
FEATURE_KROGER_CART_OAUTH = "false"
